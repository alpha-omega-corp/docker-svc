syntax = "proto3";

package auth;

option go_package = "github.com/alpha-omega-corp/user-svc/proto";

service DockerService {
  rpc CreateImage(CreateImageRequest) returns (CreateImageResponse) {}
}

message CreateImageRequest {
  string name = 1;
  string tag = 2;
  string dockerfile = 3;
}

message CreateImageResponse {
  string id = 1;
}